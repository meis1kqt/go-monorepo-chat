services:
  postgres:
    image: postgres:18-alpine
    container_name: auth-service-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auth_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-auth_service_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auth_service} -d ${POSTGRES_DB:-auth_service_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - auth-service-network


  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "50051:50051"
    env_file:
      - .env
    environment:
      CONFIG_PATH: /config/auth-local.yaml
      POSTGRES_HOST: postgres
    command: ["./auth-service"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - auth-service-network


volumes:
  postgres_data:
    driver: local

networks:
  auth-service-network:
    driver: bridge
